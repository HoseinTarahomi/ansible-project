---
- name: Ensure Traefik directory exists
  ansible.builtin.file:
    path: /opt/traefik
    state: directory
    mode: '0755'

- name: Template Traefik dynamic configuration
  ansible.builtin.template:
    src: dynamic_conf.yml.j2
    dest: /opt/traefik/dynamic_conf.yml
    mode: '0644'

- name: Template Traefik Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    mode: '0644'

- name: Deploy Traefik Stack via Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    state: present
    recreate: always
